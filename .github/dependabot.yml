version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: tuesday
      time: '00:00'
    open-pull-requests-limit: 3
    target-branch: 'develop'
    commit-message:
      prefix: 'chore: update github-action workflows'
    labels:
      - dependabot
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: monday
      time: '00:00'
    open-pull-requests-limit: 3
    target-branch: 'develop'
    commit-message:
      prefix: 'chore: update npm dependencies'
    labels:
      - dependabot
      - dependencies
    versioning-strategy: increase
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
