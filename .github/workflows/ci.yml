name: ✅ CI — Code Quality & Build

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'chore/**'
      - 'docs/**'
      - 'refactor/**'
      - 'perf/**'
      - 'test/**'
      - 'ci/**'
      - 'release/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  quality-gates:
    name: Quality Gates
    uses: ./.github/workflows/_quality.yml

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality-gates
    env:
      NPM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_OR_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_OR_ANON_KEY }}
      HS_PLATFORM_API_URL: ${{ secrets.HS_PLATFORM_API_URL }}
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build
